name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip project
        run: unzip -q AICompanion-1.zip
      - name: Build debug APK
        run: cd AICompanion-1 && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AICompanion-1.zip
          path: AICompanion-1/app/build/outputs/apk/debug/app-debug.apk
